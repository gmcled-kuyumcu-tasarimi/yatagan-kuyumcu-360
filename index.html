<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yatağan Kuyumcu 360°</title>
<link rel="stylesheet" href="lib/pannellum.min.css">
<script src="lib/pannellum.min.js"></script>
<style>
  @font-face { font-family: Montserrat; src: url(lib/Montserrat-Light.ttf); font-weight: 300; }
  @font-face { font-family: Montserrat; src: url(lib/Montserrat-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Montserrat; src: url(lib/Montserrat-SemiBold.ttf); font-weight: 600; }
  :root { --zemin:#07080d; --yazi:#efe7d8; --soluk:rgba(239,231,216,.62); --altin:#cfae6b; }
  html,body { margin:0; height:100%; background:var(--zemin); color:var(--yazi); font-family:Montserrat,system-ui,sans-serif; overflow:hidden; }
  #pano { position:fixed; inset:0; }
  .ust, .alt { position:fixed; left:0; right:0; z-index:5; pointer-events:none; padding:28px 40px; }
  .ust { top:0; background:linear-gradient(rgba(7,8,13,.72), rgba(7,8,13,0)); }
  .alt { bottom:0; background:linear-gradient(rgba(7,8,13,0), rgba(7,8,13,.78)); display:flex; justify-content:space-between; align-items:flex-end; }
  .marka { font-weight:600; font-size:13px; letter-spacing:.32em; color:var(--altin); }
  .proje { margin-top:10px; font-weight:300; font-size:22px; letter-spacing:.04em; }
  .proje small { display:block; margin-top:6px; font-size:11px; font-weight:400; letter-spacing:.22em; color:var(--soluk); text-transform:uppercase; }
  nav { display:flex; pointer-events:auto; }
  nav a { font-size:11px; font-weight:400; letter-spacing:.24em; text-transform:uppercase; color:var(--soluk); text-decoration:none;
          padding:6px 0 8px; margin-right:34px; border-bottom:1px solid transparent; cursor:pointer; }
  nav a.acik { color:var(--yazi); border-bottom-color:var(--altin); }
  nav a.kapali { opacity:.3; pointer-events:none; }
  .bilgi { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--soluk); text-align:right; line-height:1.9; pointer-events:auto; }
  .bilgi a { color:var(--soluk); text-decoration:none; border-bottom:1px solid rgba(239,231,216,.25); cursor:pointer; }
  .pnlm-load-box { background:transparent !important; border-radius:0 !important; font-family:Montserrat,sans-serif; letter-spacing:.2em; text-transform:uppercase; font-size:11px; }
  .pnlm-load-box p { font-size:11px !important; } .pnlm-lbar { border-radius:0 !important; height:1px !important; border-color:var(--altin) !important; }
  .pnlm-lbar-fill { background:var(--altin) !important; border-radius:0 !important; }
  @media (max-width:640px) { .ust, .alt { padding:18px 16px; } .alt { flex-direction:column; align-items:flex-start; gap:12px; }
    nav a { margin-right:18px; font-size:10px; letter-spacing:.16em; } .bilgi { text-align:left; } .proje { font-size:18px; } }
</style>
</head>
<body>
<div id="pano"></div>
<div class="ust">
  <div class="marka">GMC LED</div>
  <div class="proje">Yatağan · Kuyumcu<small>Aydınlatma projesi · 360° iç mekân</small></div>
</div>
<div class="alt">
  <nav id="noktalar"></nav>
  <div class="bilgi">34 ETNA 26 &nbsp;/&nbsp; 27 BLADE 12 &nbsp;/&nbsp; 12 FLAT LINE<br><a id="tam">Tam ekran</a></div>
</div>
<script>
const NOKTA = [['pano_giris', 'Giriş'], ['pano_musteri', 'Banko önü'], ['pano_personel', 'Personel'], ['pano_danisma', 'Danışma']];
const nav = document.getElementById('noktalar'); let viewer = null;
function ac(id) {
  if (viewer) viewer.destroy();
  viewer = pannellum.viewer('pano', { type: 'equirectangular', panorama: id + '.jpg', autoLoad: true, autoRotate: -1.2,
    compass: false, showZoomCtrl: false, showFullscreenCtrl: false, hfov: 95, minHfov: 40, maxHfov: 120,
    strings: { loadingLabel: 'Yükleniyor', bylineLabel: '' } });
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('acik', a.dataset.id === id));
}
NOKTA.forEach(([id, ad]) => {
  const a = document.createElement('a'); a.textContent = ad; a.dataset.id = id; a.className = 'kapali'; a.onclick = () => ac(id); nav.appendChild(a);
  fetch(id + '.jpg', { method: 'HEAD' }).then(r => { if (r.ok) { a.classList.remove('kapali'); if (!viewer && id === 'pano_giris') ac(id); } });
});
setTimeout(() => { if (!viewer) { const ilk = nav.querySelector('a:not(.kapali)'); if (ilk) ac(ilk.dataset.id); } }, 1500);
document.getElementById('tam').onclick = () => viewer && viewer.toggleFullscreen();
</script>
</body>
</html>
